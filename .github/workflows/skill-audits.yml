name: Skill auditors and distribution integrity

on:
  pull_request:
    paths:
      - '.github/workflows/skill-audits.yml'
      - 'tests/**'
      - 'skills/**'
      - 'dist/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/skill-audits.yml'
      - 'tests/**'
      - 'skills/**'
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Python ${{ matrix.python-version }} / auditors and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python audit scripts
        run: python -m compileall -q skills

      - name: Run MIDI and MusicXML auditor regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Verify published ZIP checksum and contents
        shell: bash
        run: |
          cd dist
          sha256sum --check Lua-Partitura-Midi-Skills.zip.sha256
          unzip -t Lua-Partitura-Midi-Skills.zip
          cd ..
          python - <<'PY'
          from pathlib import PurePosixPath
          from zipfile import ZipFile

          archive = 'dist/Lua-Partitura-Midi-Skills.zip'
          expected = {'transcrever-musica-para-midi', 'escrever-partituras-corretamente'}
          found = set()
          with ZipFile(archive) as bundle:
              for info in bundle.infolist():
                  path = PurePosixPath(info.filename)
                  if path.is_absolute() or '..' in path.parts or '\\' in info.filename:
                      raise SystemExit(f'Unsafe archive member: {info.filename!r}')
                  if path.name == 'SKILL.md':
                      found.update(expected.intersection(path.parts))
          if found != expected:
              raise SystemExit(f'Missing skill manifests in bundle: {sorted(expected - found)}')
          print('Both skill manifests are present; no unsafe archive paths detected.')
          PY
